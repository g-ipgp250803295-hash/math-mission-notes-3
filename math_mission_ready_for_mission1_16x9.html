<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ready for Mission 1?</title><style>:root{--v:#45171B;--r:#A16462;--c:#D5BCB5}*{box-sizing:border-box}body{margin:0;background:var(--c);font-family:Arial,Helvetica,sans-serif;color:var(--v)}.stage{width:min(100%,1280px);min-height:min(56.25vw,720px);margin:auto;padding:clamp(18px,3vw,44px);display:flex;flex-direction:column;justify-content:center}.eyebrow{text-align:center;letter-spacing:3px;font-size:12px;font-weight:bold}.heading{text-align:center;font:700 clamp(28px,4vw,53px) Georgia,serif;margin:12px 0}.subtitle{text-align:center;max-width:740px;margin:0 auto 26px;line-height:1.5}.panel{background:#fff8f4;border:2px solid var(--r);border-radius:22px;padding:clamp(20px,3vw,34px);box-shadow:0 12px 30px #45171b19;display:grid;grid-template-columns:1.25fr 0.75fr;gap:26px}.question{font:700 22px Georgia,serif;margin:0 0 16px}.item{display:flex;gap:13px;align-items:center;border:1px solid #d6b9b3;background:#f7ebe6;border-radius:12px;padding:14px;margin:10px 0;cursor:pointer;line-height:1.4}.item input{accent-color:var(--v);width:21px;height:21px;flex:none}.right{background:var(--v);color:#fff8f4;border-radius:16px;padding:25px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.symbol{font-size:46px;margin-bottom:8px}.status{font:700 clamp(23px,2.6vw,34px) Georgia,serif}.desc{line-height:1.5;color:var(--c);margin:14px 0}.bar{width:100%;height:9px;background:#80585c;border-radius:20px;overflow:hidden;margin:10px 0}.fill{width:0;height:100%;background:var(--c);transition:width .35s}.count{font-size:12px;letter-spacing:1px}.btn{border:1px solid var(--c);background:var(--c);color:var(--v);border-radius:25px;padding:12px 18px;font-weight:700;cursor:pointer;margin-top:15px}.btn:disabled{opacity:.45;cursor:not-allowed}.reset{background:none;color:var(--c);font-size:12px;border:0;cursor:pointer;margin-top:15px;text-decoration:underline}.success{animation:pop .5s ease}@keyframes pop{0%{transform:scale(.9)}65%{transform:scale(1.05)}100%{transform:scale(1)}}@media(max-width:700px){.stage{min-height:auto;padding:20px}.panel{grid-template-columns:1fr}.right{min-height:260px}.heading{font-size:32px}}</style></head><body><main class="stage"><div class="eyebrow">✦ MATH MISSION · FINAL BRIEFING ✦</div><h1 class="heading">READY FOR MISSION 1?</h1><p class="subtitle">Before entering <strong>The Missing Supplies</strong>, check that your mathematical detective skills are ready.</p><section class="panel"><div><h2 class="question">Detective's Final Readiness Check</h2><label class="item"><input type="checkbox" class="tick">I can identify important quantities in a word problem.</label><label class="item"><input type="checkbox" class="tick">I can write a mathematical expression using the correct operations and brackets.</label><label class="item"><input type="checkbox" class="tick">I can explain my steps and verify whether my answer makes sense.</label></div><div class="right"><div class="symbol" id="symbol">🔎</div><div class="status" id="status" aria-live="polite">ALMOST READY!</div><p class="desc" id="desc">Complete all three checks to receive your mission-ready message.</p><div class="bar"><div class="fill" id="fill"></div></div><div class="count" id="count">0 OF 3 CHECKS COMPLETE</div><button class="btn" id="continue" disabled>MISSION READY ✓</button><button class="reset" id="reset">Reset checklist</button></div></section></main><script>const checks=[...document.querySelectorAll('.tick')],fill=document.getElementById('fill'),count=document.getElementById('count'),status=document.getElementById('status'),desc=document.getElementById('desc'),symbol=document.getElementById('symbol'),btn=document.getElementById('continue');function update(){const n=checks.filter(x=>x.checked).length;fill.style.width=(n/3*100)+'%';count.textContent=n+' OF 3 CHECKS COMPLETE';if(n===3){status.textContent="YOU'RE MISSION READY!";desc.textContent='Excellent, Detective! Return to the NOTES page and select START MISSION 1.';symbol.textContent='✦';status.classList.remove('success');void status.offsetWidth;status.classList.add('success');btn.disabled=false}else{status.textContent=n===0?'ALMOST READY!':'KEEP GOING!';desc.textContent='Complete all three checks to receive your mission-ready message.';symbol.textContent='🔎';btn.disabled=true}}checks.forEach(x=>x.addEventListener('change',update));document.getElementById('reset').addEventListener('click',()=>{checks.forEach(x=>x.checked=false);update()});btn.addEventListener('click',()=>{if(!btn.disabled){desc.textContent='Well done! Click START MISSION 1 on your Google Sites NOTES page to begin The Missing Supplies.'}});</script></body></html>
